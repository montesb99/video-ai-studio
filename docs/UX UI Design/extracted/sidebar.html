<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
a{color:#B06AF0;text-decoration:none}
a:hover{color:#C79BF5}
</style>
</helmet>
<div style="width:232px;flex:0 0 232px;height:100%;background:#131320;border-right:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;font-family:Inter,system-ui,-apple-system,sans-serif;color:#F4F4F8;overflow:hidden">
  <div style="height:64px;flex:0 0 64px;display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid rgba(255,255,255,.06)">
    <div style="width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#7C5CFF,#B06AF0);display:flex;align-items:center;justify-content:center;flex:0 0 30px">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 1.6 11.4 7 3 12.4z" fill="#0B0B10"></path></svg>
    </div>
    <div style="font-size:15px;font-weight:600;letter-spacing:-.01em">Video AI Studio</div>
  </div>

  <div style="display:flex;flex-direction:column;gap:2px;padding:14px 12px">
    <div style="display:flex;align-items:center;gap:11px;height:40px;padding:0 12px;border-radius:10px;font-size:14px;font-weight:{{ wInicio }};color:{{ cInicio }};background:{{ bgInicio }};box-shadow:{{ shInicio }};cursor:pointer" style-hover="background:rgba(255,255,255,.04)">
      <svg width="17" height="17" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.6 7.2 9 2.4l6.4 4.8v7.2a1.2 1.2 0 0 1-1.2 1.2H3.8a1.2 1.2 0 0 1-1.2-1.2z"></path><path d="M7 15.6V9h4v6.6"></path></svg>
      <span>Inicio</span>
    </div>
    <div style="display:flex;align-items:center;gap:11px;height:40px;padding:0 12px;border-radius:10px;font-size:14px;font-weight:{{ wCrear }};color:{{ cCrear }};background:{{ bgCrear }};box-shadow:{{ shCrear }};cursor:pointer" style-hover="background:rgba(255,255,255,.04)">
      <svg width="17" height="17" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2.2" y="4.2" width="9.6" height="9.6" rx="2"></rect><path d="M11.8 8.2 15.8 5.8v6.4l-4-2.4z"></path><path d="M7 7.4v3.2M5.4 9h3.2"></path></svg>
      <span>Crear video</span>
    </div>
    <div style="display:flex;align-items:center;gap:11px;height:40px;padding:0 12px;border-radius:10px;font-size:14px;font-weight:{{ wBib }};color:{{ cBib }};background:{{ bgBib }};box-shadow:{{ shBib }};cursor:pointer" style-hover="background:rgba(255,255,255,.04)">
      <svg width="17" height="17" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.2 5.4a1.6 1.6 0 0 1 1.6-1.6h2.6l1.4 1.8h6.4a1.6 1.6 0 0 1 1.6 1.6v5.4a1.6 1.6 0 0 1-1.6 1.6H3.8a1.6 1.6 0 0 1-1.6-1.6z"></path></svg>
      <span>Biblioteca</span>
    </div>
    <div style="display:flex;align-items:center;gap:11px;height:40px;padding:0 12px;border-radius:10px;font-size:14px;font-weight:{{ wMarca }};color:{{ cMarca }};background:{{ bgMarca }};box-shadow:{{ shMarca }};cursor:pointer" style-hover="background:rgba(255,255,255,.04)">
      <svg width="17" height="17" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8.6 2.4H3.6a1.2 1.2 0 0 0-1.2 1.2v5l7 7a1.2 1.2 0 0 0 1.7 0l4.3-4.3a1.2 1.2 0 0 0 0-1.7z"></path><circle cx="5.9" cy="5.9" r="1"></circle></svg>
      <span>Identidad de marca</span>
    </div>
    <div style="display:flex;align-items:center;gap:11px;height:40px;padding:0 12px;border-radius:10px;font-size:14px;font-weight:{{ wPlan }};color:{{ cPlan }};background:{{ bgPlan }};box-shadow:{{ shPlan }};cursor:pointer" style-hover="background:rgba(255,255,255,.04)">
      <svg width="17" height="17" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2.4" y="2.4" width="5.6" height="5.6" rx="1.4"></rect><rect x="10" y="2.4" width="5.6" height="5.6" rx="1.4"></rect><rect x="2.4" y="10" width="5.6" height="5.6" rx="1.4"></rect><rect x="10" y="10" width="5.6" height="5.6" rx="1.4"></rect></svg>
      <span>Plantillas</span>
    </div>
    <div style="display:flex;align-items:center;gap:11px;height:40px;padding:0 12px;border-radius:10px;font-size:14px;font-weight:{{ wInteg }};color:{{ cInteg }};background:{{ bgInteg }};box-shadow:{{ shInteg }};cursor:pointer" style-hover="background:rgba(255,255,255,.04)">
      <svg width="17" height="17" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M6.6 2.6h4.8v2.2a1.4 1.4 0 1 0 2.8 0h1.2v4.8h-2.2a1.4 1.4 0 1 0 0 2.8v2.2H6.6v-2.2a1.4 1.4 0 1 1-2.8 0H2.6V7.4h2.2a1.4 1.4 0 1 0 0-2.8H6.6z"></path></svg>
      <span>Integraciones</span>
    </div>
  </div>

  <div style="margin:6px 16px 0;padding:14px;border:1px solid rgba(255,255,255,.06);border-radius:14px;background:#0F0F1A">
    <div style="font-size:12px;font-weight:500;color:rgba(244,244,248,.68);margin-bottom:8px">Créditos</div>
    <div style="display:flex;align-items:baseline;gap:4px;margin-bottom:10px">
      <span style="font-size:20px;font-weight:600;letter-spacing:-.01em">8.420</span>
      <span style="font-size:13px;color:rgba(244,244,248,.44)">/ 20.000</span>
    </div>
    <div style="height:6px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden">
      <div style="width:42%;height:100%;border-radius:999px;background:linear-gradient(90deg,#7C5CFF,#B06AF0)"></div>
    </div>
  </div>

  <div style="margin-top:auto;padding:16px">
    <div style="padding:16px;border:1px solid rgba(255,255,255,.06);border-radius:16px;background:linear-gradient(160deg,rgba(124,92,255,.14),rgba(19,19,32,0))">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="#B06AF0"><path d="M8 1.6 10.2 6l4.4.5-3.3 3 .9 4.4L8 11.8 3.8 13.9l.9-4.4-3.3-3L5.8 6z"></path></svg>
        <span style="font-size:14px;font-weight:600">Plan Premium</span>
      </div>
      <div style="font-size:12px;line-height:18px;color:rgba(244,244,248,.44);margin-bottom:12px;text-wrap:pretty">Más créditos, avatares premium y exportación sin marca de agua.</div>
      <div style="height:38px;border-radius:10px;background:linear-gradient(90deg,#7C5CFF,#B06AF0);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#0B0B10;cursor:pointer" style-hover="filter:brightness(1.08)">Mejorar plan</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:232,&quot;height&quot;:760},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;inicio&quot;,&quot;crear&quot;,&quot;biblioteca&quot;,&quot;marca&quot;,&quot;plantillas&quot;,&quot;integraciones&quot;],&quot;default&quot;:&quot;inicio&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active || 'inicio';
    const on = (k) => a === k;
    const v = (k) => ({
      w: on(k) ? 600 : 500,
      c: on(k) ? '#F4F4F8' : 'rgba(244,244,248,.68)',
      bg: on(k) ? 'rgba(124,92,255,.14)' : 'transparent',
      sh: on(k) ? 'inset 2px 0 0 0 #7C5CFF' : 'none'
    });
    const keys = { Inicio:'inicio', Crear:'crear', Bib:'biblioteca', Marca:'marca', Plan:'plantillas', Integ:'integraciones' };
    const out = {};
    Object.keys(keys).forEach(k => {
      const s = v(keys[k]);
      out['w'+k] = s.w; out['c'+k] = s.c; out['bg'+k] = s.bg; out['sh'+k] = s.sh;
    });
    return out;
  }
}
</script>
</body>
</html>
